[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gds2openEMS"
dynamic = ["version"]
description = "Create and run openEMS FDTD model from RFIC GDSII layout file"
authors = [
    { name = "Volker Muehlhaus", email = "volker@muehlhaus.com" }
]
license = "GPL-3.0-or-later"
readme = "README_pypi.md"
requires-python = ">=3.9"
dependencies = [
    "gdspy>1.6.0",
    "CSXCAD",
    "openEMS",
    "numpy",
    "shapely",
    "PySide6",
]

[project.urls]
Homepage = "https://github.com/VolkerMuehlhaus/gds2openEMS"
Repository = "https://github.com/VolkerMuehlhaus/gds2openEMS"
Changelog = "https://github.com/VolkerMuehlhaus/gds2openEMS/blob/main/doc/CHANGES.md"

[project.scripts]
stackupEditor = "stackup_editor.stackupEditor:main"
convert2settings = "gds2openEMS.convert2settings:main"

[tool.setuptools.dynamic]
version = {attr = "gds2openEMS.__version__"}

# The latest IHP stackup files ship inside the wheel as gds2openEMS.stackups,
# mapped from XML_stackup/latest/IHP so there is only one copy in the repo.
# Find them with gds2openEMS.utilities.get_stackup_path().
[tool.setuptools]
packages = ["gds2openEMS", "gds2openEMS.stackups", "stackup_editor"]

[tool.setuptools.package-dir]
"gds2openEMS" = "workflow/modules"
"gds2openEMS.stackups" = "XML_stackup/latest/IHP"

[tool.setuptools.package-data]
"gds2openEMS.stackups" = ["*.xml", "README.md"]
